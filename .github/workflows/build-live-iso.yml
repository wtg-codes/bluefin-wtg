---
name: Build Monthly Live ISO
"on":
  schedule:
    # Runs at 00:00 (midnight) on the 1st day of every month
    - cron: '0 0 1 * *'
  pull_request:
    paths:
      - '.github/workflows/build-weekly-iso.yml'
      - '.github/workflows/build-live-iso.yml'
      - 'cosign.pub'
      - 'recipes/**'
  # The critical trigger for your "Big Releases"
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag for this major release (e.g., v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-gate:
    name: Verify Signature & Detect Fedora Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      fedora_major: ${{ steps.fedora-version.outputs.major }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Verify Image Signature (Zero Trust Gate)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wtgos:latest"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "${IMAGE}" || \
            cosign verify --key cosign.pub --insecure-ignore-tlog=true --new-bundle-format=false "${IMAGE}"

      - name: Detect Fedora Major Version
        id: fedora-version
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wtgos:latest"
          INSPECT_JSON="$(skopeo inspect "docker://${IMAGE}")"
          OSTREE_LINUX="$(printf '%s' "${INSPECT_JSON}" | jq -r '.Labels["ostree.linux"] // empty')"
          IMAGE_VERSION="$(printf '%s' "${INSPECT_JSON}" | jq -r '.Labels["org.opencontainers.image.version"] // empty')"
          FEDORA_MAJOR="$(printf '%s\n' "${OSTREE_LINUX}" | sed -n 's/.*\.fc\([0-9][0-9]*\).*/\1/p' | head -n1)"
          if [ -z "${FEDORA_MAJOR}" ]; then
            FEDORA_MAJOR="$(printf '%s\n' "${IMAGE_VERSION}" | sed -n 's/^\([0-9][0-9]*\)\(\..*\)\?$/\1/p' | head -n1)"
          fi
          if [ -z "${FEDORA_MAJOR}" ]; then
            echo "::warning::Could not detect Fedora major version from ${IMAGE} labels; falling back to 45"
            FEDORA_MAJOR="45"
          fi
          echo "Detected Fedora major version: ${FEDORA_MAJOR} (ostree.linux=${OSTREE_LINUX:-n/a}, version=${IMAGE_VERSION:-n/a})"
          echo "major=${FEDORA_MAJOR}" >> "${GITHUB_OUTPUT}"

  build-live-iso:
    name: Build Installer ISO
    needs: verify-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Verify Image Signature (Zero Trust Gate)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wtgos:latest"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "${IMAGE}" || \
            cosign verify --key cosign.pub --insecure-ignore-tlog=true --new-bundle-format=false "${IMAGE}"

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Build Custom ISO
        uses: jasonn3/build-container-installer@bed71f841c250650a70f1ed8315ba92da1591ba6  # v1.5.0
        id: build
        with:
          arch: x86_64
          image_name: wtgos
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          # AUTHORITATIVE FIX 1: Dynamic Version Sync
          # Match Lorax boot tree Fedora major version to the built container's ostree.linux label.
          version: ${{ needs.verify-gate.outputs.fedora_major }}

          # AUTHORITATIVE FIX 2: Desktop Variant
          # Bluefin is built on GNOME. You MUST declare Silverblue, or Lorax
          # will not structure the EFI and OSTree partitions correctly.
          variant: Silverblue

          # AUTHORITATIVE FIX 3: Secure Boot MOK Enrollment
          # Custom OCI images are signed by your GitHub Actions, not Microsoft.
          # This prompts the UEFI to enroll your custom key on first boot so
          # the motherboard doesn't block the OS.
          enrollment_password: 'universalblue'

          # To make an offline ISO, you MUST tell jasonn3 action to use a live image.
          iso_name: ${{ github.event.inputs.release_version != '' && format('wtgOS-{0}-live.iso', github.event.inputs.release_version) || 'wtgOS-monthly-live.iso' }}

      - name: Publish ISO to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        if: github.ref == 'refs/heads/main'  # Only publish when pushing to main
        with:
          tag_name: ${{ github.event.inputs.release_version || 'monthly-live-iso' }}
          name: ${{ github.event.inputs.release_version != '' && format('wtgOS {0} Live Installer', github.event.inputs.release_version) || 'wtgOS Monthly Live Installer' }}
          files: |
            ${{ steps.build.outputs.iso_path }}/${{ github.event.inputs.release_version != '' && format('wtgOS-{0}-live.iso', github.event.inputs.release_version) || 'wtgOS-monthly-live.iso' }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
